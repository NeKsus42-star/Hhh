name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - run: |
          unzip -q jojostands-mod.zip
          curl -L -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip
          unzip -q mdk.zip -d mdk
          cp -r mdk/gradle mdk/gradlew jojostands/
          chmod +x jojostands/gradlew
          cd jojostands && ./gradlew setupCiWorkspace build
      - uses: actions/upload-artifact@v4
        with:
          name: jojostands-jar
          path: jojostands/build/libs/*.jar
